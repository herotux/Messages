name: Build Minimal Commons
on:
  push:
    branches: [chore/minimal-commons]
permissions:
  contents: write
jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, 'vendor only used Fossify Commons code') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and build
        run: |
          set -euo pipefail
          rm -rf /tmp/commons
          git clone --quiet https://github.com/herotux/commons.git /tmp/commons
          git -C /tmp/commons checkout --quiet 5fe79e3f1ccd62c1905f73281370e1641baaf6db

          # Remove the external Commons dependency first. The generated vendor tree must build standalone.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'^\s*implementation\(libs\.fossify\.commons\)\s*\n', '', s, flags=re.M)
          # Parcelize is supplied by the Kotlin Gradle plugin classpath. Applying it
          # without a second version avoids the Kotlin 2.4 "unknown version" conflict.
          if 'org.jetbrains.kotlin.plugin.parcelize' not in s:
              s = s.replace('id("org.jetbrains.kotlin.plugin.compose") version "2.4.10"\n', 'id("org.jetbrains.kotlin.plugin.compose") version "2.4.10"\n')
              marker = '}\n\nval keystorePropertiesFile'
              s = s.replace(marker, '}\n\napply(plugin = "org.jetbrains.kotlin.plugin.parcelize")\n\nval keystorePropertiesFile', 1)
          p.write_text(s)
          p = Path('gradle/libs.versions.toml')
          s = p.read_text()
          s = re.sub(r'^commons\s*=.*\n', '', s, flags=re.M)
          s = re.sub(r'^fossify-commons\s*=.*\n', '', s, flags=re.M)
          p.write_text(s)
          PY

          python3 tools/extract_minimal_commons.py
          python3 tools/finish_minimal_commons.py

          # Minimal Commons is vendored into the app module, whose resource namespace is
          # org.fossify.messages. Rewrite old Commons R imports/references to the app R and
          # import app R into vendored Commons files. Then copy any Commons resources used by
          # those vendored files without replacing existing Messages resources.
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          import xml.etree.ElementTree as ET

          ROOT = Path('.')
          APP = ROOT / 'app/src/main'
          COMMONS_RES = Path('/tmp/commons/commons/src/main/res')
          need = set()

          kotlin_files = list(APP.rglob('*.kt'))
          for p in kotlin_files:
              s = p.read_text(errors='ignore')
              for typ, name in re.findall(r'org\.fossify\.commons\.R\.(\w+)\.(\w+)', s):
                  need.add((typ, name))
              if 'org.fossify.commons.R' in s:
                  s = s.replace('org.fossify.commons.R', 'org.fossify.messages.R')
              s = s.replace('org.fossify.commons.databinding', 'org.fossify.messages.databinding')
              if p.as_posix().startswith('app/src/main/kotlin/org/fossify/commons/') and re.search(r'\bR\.', s):
                  if 'import org.fossify.messages.R' not in s:
                      s = re.sub(r'(^\s*package\s+[^\n]+\n)', r'\1\nimport org.fossify.messages.R\n', s, count=1, flags=re.M)
              p.write_text(s)

          for p in APP.joinpath('kotlin/org/fossify/commons').rglob('*.kt'):
              s = p.read_text(errors='ignore')
              for typ, name in re.findall(r'\bR\.(\w+)\.(\w+)', s):
                  need.add((typ, name))

          def values_children(path):
              try:
                  root = ET.parse(path).getroot()
                  return root, list(root)
              except Exception:
                  return None, []

          def child_key(child):
              tag = child.tag.split('}')[-1]
              name = child.attrib.get('name')
              if tag == 'item' and child.attrib.get('type'):
                  tag = child.attrib['type']
              if tag == 'declare-styleable':
                  tag = 'styleable'
              return tag, name

          def merge_value(p, wanted):
              src_root, src_children = values_children(p)
              if src_root is None:
                  return
              selected = [c for c in src_children if child_key(c) in wanted]
              if not selected:
                  return
              out = APP / 'res' / p.relative_to(COMMONS_RES)
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists():
                  dst_root, dst_children = values_children(out)
                  if dst_root is None:
                      return
                  existing = {child_key(c) for c in dst_children}
                  changed = False
                  for child in selected:
                      k = child_key(child)
                      if k not in existing:
                          dst_root.append(child); existing.add(k); changed = True
                      elif k[0] == 'styleable':
                          dst = next(c for c in dst_root if child_key(c) == k)
                          have = {child_key(x) for x in dst}
                          for nested in child:
                              nk = child_key(nested)
                              if nk not in have:
                                  dst.append(nested); have.add(nk); changed = True
                  if changed:
                      ET.ElementTree(dst_root).write(out, encoding='utf-8', xml_declaration=True)
              else:
                  root = ET.Element(src_root.tag, src_root.attrib)
                  for child in selected: root.append(child)
                  ET.ElementTree(root).write(out, encoding='utf-8', xml_declaration=True)

          def copy_resource(p):
              if p.stem.startswith('bank_'):
                  return
              out = APP / 'res' / p.relative_to(COMMONS_RES)
              if not out.exists():
                  out.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, out)

          def xml_refs(xml):
              return re.findall(r'@\+?(string|color|dimen|drawable|mipmap|layout|xml|menu|style|font|array|plurals|integer|bool|fraction|id|raw|anim|animator)/([A-Za-z0-9_]+)', xml)

          defs = {}
          layouts = {}
          for p in [x for x in COMMONS_RES.rglob('*') if x.is_file() and not x.stem.startswith('bank_')]:
              if p.parent.name.startswith('values'):
                  _, children = values_children(p)
                  for c in children:
                      k = child_key(c)
                      if k[1]: defs.setdefault(k, []).append(p)
              else:
                  k = (p.parent.name.split('-')[0], p.stem)
                  defs.setdefault(k, []).append(p)
                  if p.parent.name.startswith('layout'):
                      layouts.setdefault(p.stem, []).append(p)

          # Generated View/Data Binding names are derived from layout filenames.
          # Match the generated class exactly, then copy all configuration variants.
          bindings = set()
          for p in APP.rglob('*.kt'):
              bindings.update(re.findall(r'\b([A-Z][A-Za-z0-9_]*)Binding\b', p.read_text(errors='ignore')))
          for stem, files in layouts.items():
              generated = ''.join(part[:1].upper() + part[1:] for part in stem.split('_')) + 'Binding'
              if generated in bindings:
                  for p in files:
                      copy_resource(p)

          # Commons View/DataBinding classes depend on generated bindings.
          # The binding generator only sees layouts that physically exist in the
          # app resource tree, so vendor every Commons layout variant. This is
          # still resource-only; Kotlin/Java remains minimal.
          for layout_src in COMMONS_RES.rglob("*.xml"):
              if layout_src.parent.name.startswith("layout") and not layout_src.stem.startswith("bank_"):
                  copy_resource(layout_src)

          # Resolve resources used by app/Commons code and by copied XML.
          queue = list(need)
          seen = set()
          while queue:
              typ, name = queue.pop()
              if (typ, name) in seen:
                  continue
              seen.add((typ, name))
              for p in defs.get((typ, name), []):
                  if p.parent.name.startswith('values'):
                      _, children = values_children(p)
                      for c in children:
                          if child_key(c) == (typ, name):
                              queue.extend(xml_refs(ET.tostring(c, encoding='unicode')))
                      merge_value(p, {(typ, name)})
                  else:
                      xml = p.read_text(errors='ignore') if p.suffix.lower() in ('.xml', '.svg') else ''
                      queue.extend(xml_refs(xml))
                      copy_resource(p)

          # Resolve ids by locating the layout that declares @+id/name.
          for typ, name in list(seen):
              if typ != 'id':
                  continue
              for p in COMMONS_RES.rglob('*'):
                  if not p.is_file() or not p.parent.name.startswith('layout') or p.stem.startswith('bank_'):
                      continue
                  xml = p.read_text(errors='ignore')
                  if re.search(r'@\+id/' + re.escape(name) + r'\b', xml):
                      copy_resource(p)

          print('FINISH_RESOURCES', len(seen), 'BINDINGS', sorted(bindings))
          PY

          # Clean duplicate Android values resources after Commons extraction.
          python3 - <<'PY2'
from pathlib import Path
import subprocess
import xml.etree.ElementTree as ET

RES = Path("app/src/main/res")

tracked = {
    Path(x)
    for x in subprocess.check_output(
        ["git", "ls-files", "app/src/main/res"],
        text=True
    ).splitlines()
}

def resource_key(child):
    tag = child.tag.split("}")[-1]

    if tag == "item" and child.attrib.get("type"):
        tag = child.attrib["type"]

    if tag == "declare-styleable":
        tag = "styleable"

    name = child.attrib.get("name")
    return tag, name

for d in sorted(RES.glob("values*")):
    if not d.is_dir():
        continue

    owners = {}

    for f in sorted(d.glob("*.xml")):
        try:
            root = ET.parse(f).getroot()
        except Exception:
            continue

        for child in list(root):
            k = resource_key(child)

            if k[1]:
                owners.setdefault(k, []).append(f)

    for k, files in owners.items():
        if len(files) <= 1:
            continue

        tracked_files = [f for f in files if f in tracked]

        keep = tracked_files[0] if tracked_files else files[0]

        for f in files:
            if f == keep:
                continue

            try:
                root = ET.parse(f).getroot()
            except Exception:
                continue

            changed = False

            for child in list(root):
                if resource_key(child) == k:
                    root.remove(child)
                    changed = True

            if not changed:
                continue

            if len(list(root)) == 0:
                f.unlink()
            else:
                ET.ElementTree(root).write(
                    f,
                    encoding="utf-8",
                    xml_declaration=True
                )

print("VALUES_DUPLICATES_CLEANED")
PY2
# Bank logos are permanent Messages source resources. They are NOT downloaded,
          # converted, or regenerated in CI. Keep Sepah as PNG; all other bank logos
          # must be VectorDrawable XML. Operator PNGs are unrelated and untouched.
          find app/src/main/res/drawable -maxdepth 1 -type f -name 'bank_*.png' ! -name 'bank_sepah.png' -delete
          test -f app/src/main/res/drawable/bank_sepah.png
          test -f app/src/main/res/drawable/bank_sina.xml
          test ! -e app/src/main/res/drawable/bank_sina.png
          test -f app/src/main/res/drawable/bank_tosee_taavon.xml
          test ! -e app/src/main/res/drawable/bank_tosee_taavon.png

          ./gradlew :app:compileCoreDebugKotlin --no-daemon --stacktrace

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main tools/finish_minimal_commons.py app/build.gradle.kts gradle/libs.versions.toml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: vendor only used Fossify Commons code'
          git pull --rebase origin chore/minimal-commons
          git push origin HEAD:chore/minimal-commons
