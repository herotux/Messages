name: Build Minimal Commons
on:
  push:
    branches: [chore/minimal-commons]
permissions:
  contents: write
jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, 'vendor only used Fossify Commons code') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and build
        run: |
          set -euo pipefail
          rm -rf /tmp/commons
          git clone --quiet https://github.com/herotux/commons.git /tmp/commons
          git -C /tmp/commons checkout --quiet 5fe79e3f1ccd62c1905f73281370e1641baaf6db
          python3 tools/extract_minimal_commons.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts'); s=p.read_text(); s=s.replace('        implementation(libs.fossify.commons)\n\n',''); p.write_text(s)
          p=Path('gradle/libs.versions.toml'); s=p.read_text(); s=re.sub(r'^commons\s*=.*\n','',s,flags=re.M); s=re.sub(r'^fossify-commons\s*=.*\n','',s,flags=re.M); p.write_text(s)
          PY
          rm -f tools/extract_minimal_commons.py .github/workflows/inspect-commons.yml .github/workflows/extract-minimal-commons.yml
          ./gradlew :app:compileCoreDebugKotlin --no-daemon --stacktrace
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/build.gradle.kts gradle/libs.versions.toml tools/extract_minimal_commons.py .github/workflows/inspect-commons.yml .github/workflows/extract-minimal-commons.yml
          git diff --cached --stat
          git commit -m 'refactor: vendor only used Fossify Commons code'
          git push origin HEAD:chore/minimal-commons
