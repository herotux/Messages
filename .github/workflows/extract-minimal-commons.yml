name: Build Minimal Commons
on:
  push:
    branches: [chore/minimal-commons]
permissions:
  contents: write
jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, 'vendor only used Fossify Commons code') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and build
        run: |
          set -euo pipefail
          rm -rf /tmp/commons
          git clone --quiet https://github.com/herotux/commons.git /tmp/commons
          git -C /tmp/commons checkout --quiet 5fe79e3f1ccd62c1905f73281370e1641baaf6db

          # Remove the external Commons dependency first. The generated vendor tree must build standalone.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(r'^\s*implementation\(libs\.fossify\.commons\)\s*\n', '', s, flags=re.M)
          p.write_text(s)
          p = Path('gradle/libs.versions.toml')
          s = p.read_text()
          s = re.sub(r'^commons\s*=.*\n', '', s, flags=re.M)
          s = re.sub(r'^fossify-commons\s*=.*\n', '', s, flags=re.M)
          p.write_text(s)
          PY

          python3 tools/extract_minimal_commons.py

          # Minimal Commons is vendored into the app module, whose resource namespace is
          # org.fossify.messages. Rewrite old Commons R imports/references to the app R and
          # import app R into vendored Commons files. Then copy any Commons resources used by
          # those vendored files without replacing existing Messages resources.
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          import xml.etree.ElementTree as ET

          ROOT = Path('.')
          APP = ROOT / 'app/src/main'
          COMMONS_RES = Path('/tmp/commons/commons/src/main/res')
          need = set()

          kotlin_files = list(APP.rglob('*.kt'))
          for p in kotlin_files:
              s = p.read_text(errors='ignore')
              for typ, name in re.findall(r'org\.fossify\.commons\.R\.(\w+)\.(\w+)', s):
                  need.add((typ, name))
              if 'org.fossify.commons.R' in s:
                  s = s.replace('org.fossify.commons.R', 'org.fossify.messages.R')
              if p.as_posix().startswith('app/src/main/kotlin/org/fossify/commons/') and re.search(r'\bR\.', s):
                  if 'import org.fossify.messages.R' not in s:
                      s = re.sub(r'(^\s*package\s+[^\n]+\n)', r'\1\nimport org.fossify.messages.R\n', s, count=1, flags=re.M)
              p.write_text(s)

          # Collect bare R references from vendored Commons files after imports are fixed.
          for p in APP.joinpath('kotlin/org/fossify/commons').rglob('*.kt'):
              s = p.read_text(errors='ignore')
              for typ, name in re.findall(r'\bR\.(\w+)\.(\w+)', s):
                  need.add((typ, name))

          def existing_keys():
              keys = set()
              res = APP / 'res'
              for p in res.rglob('*'):
                  if not p.is_file():
                      continue
                  d = p.parent.name.split('-')[0]
                  if d.startswith('values'):
                      try:
                          root = ET.parse(p).getroot()
                          for child in root:
                              if child.attrib.get('name'):
                                  keys.add((child.tag.split('}')[-1], child.attrib['name']))
                      except Exception:
                          pass
                  else:
                      keys.add((d, p.stem))
              return keys

          keys = existing_keys()
          for typ, name in sorted(need):
              for p in COMMONS_RES.rglob('*'):
                  if not p.is_file() or p.stem != name or p.name.startswith('bank_'):
                      continue
                  d = p.parent.name.split('-')[0]
                  if d != typ:
                      continue
                  key = (d, name)
                  if key in keys:
                      continue
                  out = APP / 'res' / p.relative_to(COMMONS_RES)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, out)
                  keys.add(key)

          print('COMMONS_R_RESOURCES', sorted(need))
          PY

          # Bank logos are permanent Messages source resources. They are NOT downloaded,
          # converted, or regenerated in CI. Keep Sepah as PNG; all other bank logos
          # must be VectorDrawable XML. Operator PNGs are unrelated and untouched.
          find app/src/main/res/drawable -maxdepth 1 -type f -name 'bank_*.png' ! -name 'bank_sepah.png' -delete
          test -f app/src/main/res/drawable/bank_sepah.png
          test -f app/src/main/res/drawable/bank_sina.xml
          test ! -e app/src/main/res/drawable/bank_sina.png
          test -f app/src/main/res/drawable/bank_tosee_taavon.xml
          test ! -e app/src/main/res/drawable/bank_tosee_taavon.png

          ./gradlew :app:compileCoreDebugKotlin --no-daemon --stacktrace

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main app/build.gradle.kts gradle/libs.versions.toml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: vendor only used Fossify Commons code'
          git pull --rebase origin chore/minimal-commons
          git push origin HEAD:chore/minimal-commons
