name: One-shot bank cards runtime hardening

on:
  push:
    paths:
      - '.github/workflows/one-shot-bankcards-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden bank cards loading and pager state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/fossify/messages/activities/BankCardsActivity.kt')
          s = p.read_text()
          old = '''    private fun loadCards() {
            Thread {
                val result = repository.getCards()
                runOnUiThread {
                    cards = result.toMutableList()
                    pager.post { adapter.notifyDataSetChanged() }
                }
            }.start()
        }
'''
          new = '''    private fun loadCards() {
            Thread {
                val result = repository.getCards()
                runOnUiThread {
                    if (isFinishing || isDestroyed) return@runOnUiThread
                    cards = result.toMutableList()
                    adapter.notifyDataSetChanged()
                    if (cards.isEmpty()) {
                        if (pager.currentItem != 0) pager.setCurrentItem(0, false)
                    } else if (pager.currentItem >= cards.size) {
                        pager.setCurrentItem(cards.lastIndex, false)
                    }
                }
            }.start()
        }
'''
          if old not in s:
              raise SystemExit('expected loadCards block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-bankcards-fix.yml
          git add app/src/main/kotlin/org/fossify/messages/activities/BankCardsActivity.kt
          git commit -m 'Harden bank cards activity state after saving cards'
          git push
