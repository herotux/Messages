name: One-shot bank cards link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link dedicated bank cards screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt')
          s = p.read_text()
          old = 'row(root, "حساب‌ها و کارت‌های بانکی", "افزودن، ویرایش و حذف کارت‌ها") { BankAccountsFeature.showBankAccountManager(this) }'
          new = 'row(root, "حساب‌ها و کارت‌های بانکی", "افزودن، ویرایش و حذف کارت‌ها") { startActivity(Intent(this, BankCardsActivity::class.java)) }'
          if old not in s:
              raise SystemExit('Settings bank row not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '''        <activity\n            android:name=".activities.SettingsActivity"'''
          activity = '''        <activity\n            android:name=".activities.BankCardsActivity"\n            android:configChanges="orientation"\n            android:exported="false"\n            android:label="@string/settings"\n            android:parentActivityName=".activities.SettingsActivity" />\n\n'''
          if 'android:name=".activities.BankCardsActivity"' not in s:
              if marker not in s:
                  raise SystemExit('SettingsActivity manifest marker not found')
              s = s.replace(marker, activity + marker, 1)
          p.write_text(s)
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt app/src/main/AndroidManifest.xml .github/workflows/one-shot-bank-cards-link.yml
          git rm .github/workflows/one-shot-bank-cards-link.yml
          git commit -m "Link dedicated bank cards settings screen"
          git push
