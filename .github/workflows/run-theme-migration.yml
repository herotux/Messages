name: Run Homa theme root migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/theme-root-migration
          fetch-depth: 1
      - run: echo "theme migration runner is alive"
