name: Run Homa theme root migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/theme-root-migration
          fetch-depth: 1
      - name: Migrate feature branch
        run: |
          set -euo pipefail
          FILE=app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt
          sed -i '/import org\.fossify\.messages\.helpers\.BackgroundThemeManager$/d' "$FILE"
          sed -i 's/BackgroundThemeManager\.applyToRoot(root, BackgroundThemeManager\.selectedId(this))/ThemeManager.applyBackground(this)/' "$FILE"
          perl -0pi -e 's/\n    private fun showLegacyBackgrounds\(\) \{.*?\n    \}\n/\n    private fun showLegacyBackgrounds() {\n        val themes = ThemeManager.allThemes(this).filter { it.source == ThemeManager.ThemeSource.BUILT_IN && it.id != ThemeManager.DEFAULT_ID }\n        val labels = themes.map { if (english()) it.nameEn else it.nameFa }.toTypedArray()\n        val selected = themes.indexOfFirst { it.id == ThemeManager.selectedThemeId(this) }.coerceAtLeast(0)\n        MaterialAlertDialogBuilder(this).setTitle(t("پس‌زمینه‌های آماده", "Ready-made backgrounds")).setSingleChoiceItems(labels, selected) { dialog, which -> ThemeManager.select(this, themes[which].id); dialog.dismiss(); render(APPEARANCE) }.show()\n    }\n/s' "$FILE"

          STYLES=app/src/main/res/values/styles.xml
          perl -0pi -e 's/parent="AppTheme\.Base\.Core"/parent="AppTheme.Base"/g; s/\n?\s*<style name="AppTheme\.Base"(?:\s+[^>]*)?>.*?<\/style>\s*/\n/sg; s/\n?\s*<style name="AppTheme\.Base\.Core"(?:\s+[^>]*)?>.*?<\/style>\s*/\n/sg; s/\n?\s*<style name="AppTheme\.Base\.System"(?:\s+[^>]*)?>.*?<\/style>\s*/\n/sg; s/\n?\s*<style name="AppTheme\.Base\.System\.Light"(?:\s+[^>]*)?>.*?<\/style>\s*/\n/sg' "$STYLES"
          rm -f app/src/main/kotlin/org/fossify/messages/helpers/BackgroundThemeManager.kt
          ! git grep -n -E 'BackgroundThemeManager|AppTheme\.Base\.(Core|System|System\.Light)'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete root theme migration'
          git push origin HEAD:feat/theme-root-migration
      - name: Remove temporary runner
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/run-theme-migration.yml
          git commit -m 'chore(ci): remove temporary theme migration runner'
          git push origin main
