name: Import Iranian bank logos

on:
  push:
    branches:
      - feat/iranian-bank-registry
      - fix/bank-sender-only-and-sepah-logo-v4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-bank-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python3 -m pip install Pillow

      - name: Remove VectorDrawable bank logos
        run: rm -f app/src/main/res/drawable/bank_*.xml

      - name: Import 64px Iranian bank PNGs
        run: python3 tools/import_iranian_bank_logos.py

      - name: Commit generated PNG bank logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/bank_*.png app/src/main/res/drawable/bank_*.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: replace Iranian bank VectorDrawables with PNG logos [skip ci]"
          git push
