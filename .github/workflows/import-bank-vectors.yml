name: Import Iranian bank logos

on:
  push:
    branches:
      - feat/iranian-bank-registry
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-bank-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SVG to VectorDrawable converter
        run: npm install -g svg2vectordrawable

      - name: Remove old bank image resources
        run: rm -f app/src/main/res/drawable/bank_*.png app/src/main/res/drawable/bank_*.xml

      - name: Import color SVG bank logos as Android VectorDrawables
        run: python3 tools/import_iranian_bank_logos.py

      - name: Commit generated VectorDrawable bank logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/bank_*.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: replace bank logos with SVG VectorDrawables [skip ci]"
          git push
