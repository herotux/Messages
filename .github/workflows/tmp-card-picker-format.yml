name: Temporary card picker format update

on:
  push:
    paths:
      - '.github/workflows/tmp-card-picker-format.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-material3-ui
          fetch-depth: 0
      - name: Update picker format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/fossify/messages/helpers/BankAccountsFeature.kt')
          s = p.read_text()
          old = '''append(title(activity, "شماره کارت", "Card number")); append(": "); append(formatCard(account.cardNumber)); if (account.holderName.isNotBlank()) { append("\\n"); append(title(activity, "به نام", "Name")); append(": "); append(account.holderName) }; if (account.iban.isNotBlank()) { append("\\nIBAN: "); append(formatIban(account.iban)) }'''
          new = '''append(title(activity, "بانک", "Bank")); append(": "); append(accountBankName(activity, account)); append("\\n"); append(title(activity, "شماره کارت", "Card number")); append(":\\n"); append(formatCard(account.cardNumber)); if (account.holderName.isNotBlank()) { append("\\n"); append(title(activity, "صاحب کارت", "Card holder")); append(": "); append(account.holderName) }; if (account.iban.isNotBlank()) { append("\\n"); append(title(activity, "شماره شبا", "IBAN")); append(":\\n"); append(formatIban(account.iban)) }'''
          if old not in s:
              raise SystemExit('Target picker text block not found')
          s = s.replace(old, new, 1)
          marker = '''    fun addPickerButton(activity: Activity)'''
          helper = '''    private fun accountBankName(context: Context, account: BankAccount): String = bankFor(account)?.let { title(context, it.persianName, it.englishName) } ?: account.bankId

'''
          if helper.strip() not in s:
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/org/fossify/messages/helpers/BankAccountsFeature.kt
          git commit -m 'fix: format selected bank card details on separate lines' || exit 0
          git push origin HEAD:feat/figma-material3-ui
          git rm .github/workflows/tmp-card-picker-format.yml
          git commit -m 'chore: remove temporary card picker workflow'
          git push origin HEAD:feat/figma-material3-ui
