name: Finalize Homa theme root migration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.head_ref }}

      - name: Migrate theme ownership and remove legacy theme definitions
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          settings = root / 'app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt'
          text = settings.read_text(encoding='utf-8')
          text = text.replace('import org.fossify.messages.helpers.BackgroundThemeManager\n', '')
          text = text.replace('BackgroundThemeManager.applyToRoot(root, BackgroundThemeManager.selectedId(this))', 'ThemeManager.applyBackground(this)')
          old = '''    private fun showLegacyBackgrounds() {
          val themes = BackgroundThemeManager.themes.filter { it.id != BackgroundThemeManager.NONE }
          val labels = themes.map { if (english()) it.titleEn else it.titleFa }.toTypedArray()
          val selected = themes.indexOfFirst { it.id == BackgroundThemeManager.selectedId(this) }.coerceAtLeast(0)
          MaterialAlertDialogBuilder(this).setTitle(t("پس‌زمینه‌های آماده", "Ready-made backgrounds")).setSingleChoiceItems(labels, selected) { dialog, which -> BackgroundThemeManager.select(this, themes[which].id); dialog.dismiss(); render(APPEARANCE) }.show()
      }
'''
          new = '''    private fun showLegacyBackgrounds() {
          val themes = ThemeManager.allThemes(this).filter { it.source == ThemeManager.ThemeSource.BUILT_IN && it.id != ThemeManager.DEFAULT_ID }
          val labels = themes.map { if (english()) it.nameEn else it.nameFa }.toTypedArray()
          val selected = themes.indexOfFirst { it.id == ThemeManager.selectedThemeId(this) }.coerceAtLeast(0)
          MaterialAlertDialogBuilder(this).setTitle(t("پس‌زمینه‌های آماده", "Ready-made backgrounds")).setSingleChoiceItems(labels, selected) { dialog, which -> ThemeManager.select(this, themes[which].id); dialog.dismiss(); render(APPEARANCE) }.show()
      }
'''
          if old not in text:
              raise SystemExit('SettingsActivity legacy background block not found')
          settings.write_text(text.replace(old, new), encoding='utf-8')

          styles = root / 'app/src/main/res/values/styles.xml'
          text = styles.read_text(encoding='utf-8')
          for name in ['AppTheme.Base', 'AppTheme.Base.Core', 'AppTheme.Base.System', 'AppTheme.Base.System.Light']:
              pattern = re.compile(r'\n?\s*<style\s+name="' + re.escape(name) + r'"(?:\s+[^>]*)?>.*?</style>\s*', re.S)
              text, n = pattern.subn('\n', text, count=1)
              if n != 1:
                  raise SystemExit(f'Expected exactly one legacy style definition for {name}, found {n}')

          candidates = ['AppTheme.White', 'AppTheme.White.LightTextColor', 'AppTheme.White.TextStyle', 'AppTheme.White.NoActionBar', 'AppTheme.BlackAndWhite', 'AppTheme.BlackAndWhite.DarkTextColor', 'AppTheme.BlackAndWhite.TextStyle', 'BottomSheetDialogTheme', 'BottomSheetModalStyle']
          all_files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p != styles]
          corpus = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in all_files)
          for name in candidates:
              if re.search(r'(?<![A-Za-z0-9_.])' + re.escape(name) + r'(?![A-Za-z0-9_.])', corpus):
                  continue
              pattern = re.compile(r'\n?\s*<style\s+name="' + re.escape(name) + r'"(?:\s+[^>]*)?>.*?</style>\s*', re.S)
              text, n = pattern.subn('\n', text, count=1)
              if n:
                  print('removed unused legacy style:', name)
          styles.write_text(text, encoding='utf-8')

          adapter = root / 'app/src/main/kotlin/org/fossify/messages/helpers/BackgroundThemeManager.kt'
          if adapter.exists(): adapter.unlink()

          result = subprocess.run(['git', 'grep', '-nE', 'BackgroundThemeManager|AppTheme\\.Base\\.(Core|System|System\\.Light)'], text=True, capture_output=True)
          if result.returncode == 0 and result.stdout.strip():
              raise SystemExit('Legacy theme references remain:\n' + result.stdout)

      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/theme-root-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete root theme migration'
          git push origin HEAD:${{ github.head_ref }}
