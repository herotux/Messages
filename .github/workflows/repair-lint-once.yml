name: Repair lint baseline once

on:
  push:
    branches:
      - chore/minimal-commons

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'repair lint baseline') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Fix PinNumberStyle resource cycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/values/styles.xml')
          s = p.read_text()
          old = '<style name="PinNumberStyle.Base">'
          new = '<style name="PinNumberStyle.Base" parent="@android:style/Widget.TextView">'
          if old not in s:
              raise SystemExit('PinNumberStyle.Base declaration not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Regenerate lint baseline
        run: ./gradlew updateLintBaseline --stacktrace

      - name: Verify lint
        run: ./gradlew lint --stacktrace

      - name: Commit repair and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-lint-once.yml
          git add app/src/main/res/values/styles.xml app/lint-baseline.xml
          git commit -m 'Repair lint baseline and PinNumberStyle cycle'
          git push origin HEAD:chore/minimal-commons
