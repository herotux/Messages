name: Temp Fix Theme Route
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix stale ThemeBuilder route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt')
          s = p.read_text()
          old = 'startActivity(Intent(this, HerotuxAboutActivity::class.java).putExtra(EXTRA_THEME_BUILDER, true).putExtra(EXTRA_THEME_ID, theme.id))'
          new = 'startActivity(Intent(this, ThemeBuilderActivity::class.java).putExtra(EXTRA_THEME_ID, theme.id))'
          if old not in s:
              raise SystemExit('expected stale route not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt
          git commit -m 'fix: route theme editing directly to ThemeBuilder'
          git push