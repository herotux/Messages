name: Temporary main theme cleanup
on:
  push:
    paths:
      - '.github/workflows/tmp-main-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Remove obsolete theme builder constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt')
          s = p.read_text()
          line = '        private const val EXTRA_THEME_BUILDER = "theme_builder"\n'
          if line in s:
              s = s.replace(line, '', 1)
              p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt
          git commit -m 'chore: remove obsolete theme builder route constant' || true
          git push origin HEAD:main
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/tmp-main-cleanup.yml
          git add .github/workflows/tmp-main-cleanup.yml
          git commit -m 'chore: remove temporary cleanup workflow' || true
          git push origin HEAD:main || true

