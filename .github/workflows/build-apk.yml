name: Android CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build and upload the signed FOSS release APK'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Canonical Android validation for main and pull requests.
# A signed FOSS release build runs only on main pushes or explicit dispatch.
jobs:
  unit-tests:
    name: Unit tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Core
            task: testCoreDebugUnitTest
          - variant: FOSS
            task: testFossDebugUnitTest
          - variant: GPlay
            task: testGplayDebugUnitTest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run ${{ matrix.variant }} unit tests
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lint --stacktrace --no-daemon

  build-apk:
    name: Build FOSS release APK
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build_apk == true)
    needs:
      - unit-tests
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/messages-release.p12
      TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
      TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect APK
        run: |
          mkdir -p artifact
          APK=$(find app/build/outputs/apk -type f -name '*foss*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "artifact/Messages-foss-release.apk"

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-foss-release
          path: artifact/Messages-foss-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Bale
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: '@homaapp'
        run: |
          set -euo pipefail
          test -n "$BALE_BOT_TOKEN"
          test -s "artifact/Messages-foss-release.apk"

          VERSION_NAME=$(grep -E '^versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName\s*=\s*["\x27]([^"\x27]+)["\x27].*/\1/' || true)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="${GITHUB_SHA::7}"
          fi

          CAPTION="Homa Messages — FOSS Release v${VERSION_NAME}\nCommit: ${GITHUB_SHA::7}\nBuild: ${GITHUB_RUN_NUMBER}"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 30 \
            --max-time 1800 \
            -X POST \
            "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${BALE_CHAT_ID}" \
            -F "document=@artifact/Messages-foss-release.apk;type=application/vnd.android.package-archive" \
            -F "caption=${CAPTION}"

      - name: Remove release keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
