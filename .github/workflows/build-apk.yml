name: Android CI

# Keep CI on the current PR head so the merge ref is rebuilt after fixes.

on:
  push:
    branches:
      - main
      - test/foss-release-signed
      - feat/iranian-bank-registry
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python3 -m pip install Pillow

      - name: Generate PNG bank resources
        run: |
          rm -f app/src/main/res/drawable/bank_*.xml
          python3 tools/import_iranian_bank_logos.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Core unit tests
        run: ./gradlew testCoreDebugUnitTest --stacktrace

      - name: Run FOSS unit tests
        run: ./gradlew testFossDebugUnitTest --stacktrace

      - name: Run GPlay unit tests
        run: ./gradlew testGplayDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build Core debug APK
        run: ./gradlew assembleCoreDebug --stacktrace

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Build GPlay debug APK
        run: ./gradlew assembleGplayDebug --stacktrace

      - name: Collect Core APK
        run: |
          mkdir -p artifacts/core
          APK=$(find app/build/outputs/apk -type f -name '*core*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/core/Messages-core-debug.apk
          ls -lh artifacts/core/Messages-core-debug.apk

      - name: Collect FOSS APK
        run: |
          mkdir -p artifacts/foss
          APK=$(find app/build/outputs/apk -type f -name '*foss*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/foss/Messages-foss-debug.apk
          ls -lh artifacts/foss/Messages-foss-debug.apk

      - name: Collect GPlay APK
        run: |
          mkdir -p artifacts/gplay
          APK=$(find app/build/outputs/apk -type f -name '*gplay*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/gplay/Messages-gplay-debug.apk
          ls -lh artifacts/gplay/Messages-gplay-debug.apk

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-core-debug
          path: artifacts/core/Messages-core-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-foss-debug
          path: artifacts/foss/Messages-foss-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload GPlay APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-gplay-debug
          path: artifacts/gplay/Messages-gplay-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
