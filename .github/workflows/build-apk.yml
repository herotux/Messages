name: Android CI

on:
  push:
    branches:
      - main
      - test/foss-release-signed
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testCoreDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build core debug APK
        run: ./gradlew assembleCoreDebug --stacktrace

      - name: Build foss debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Build gplay debug APK
        run: ./gradlew assembleGplayDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          ls -lh artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fossify-messages-debug-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
