name: Android CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build and upload the signed FOSS release APK'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Core
            task: testCoreDebugUnitTest
          - variant: FOSS
            task: testFossDebugUnitTest
          - variant: GPlay
            task: testGplayDebugUnitTest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Run ${{ matrix.variant }} unit tests
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Run lint
        run: ./gradlew lint --stacktrace --no-daemon

  build-apk:
    name: Build FOSS release APK
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build_apk == true)
    needs:
      - unit-tests
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/messages-release.p12
      TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
      TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifact"
          mkdir -p "$ARTIFACT_DIR"
          APK=$(find "$GITHUB_WORKSPACE/app/build/outputs/apk" -type f -name '*foss*release*.apk' -print -quit)
          test -n "$APK"
          test -f "$APK"
          cp -- "$APK" "$ARTIFACT_DIR/Messages-foss-release.apk"
          test -s "$ARTIFACT_DIR/Messages-foss-release.apk"
          stat --printf='Collected APK size: %s bytes\n' "$ARTIFACT_DIR/Messages-foss-release.apk"
      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-foss-release
          path: artifact/Messages-foss-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to Bale
        shell: bash
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: '@homaapp'
        run: |
          set -euo pipefail
          APK_PATH="$GITHUB_WORKSPACE/artifact/Messages-foss-release.apk"
          test -n "$BALE_BOT_TOKEN"
          test -f "$APK_PATH"
          test -s "$APK_PATH"
          echo "Publishing APK: $APK_PATH"
          stat --printf='APK size: %s bytes\n' "$APK_PATH"
          VERSION_NAME=$(grep -E '^versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName\s*=\s*["\x27]([^"\x27]+)["\x27].*/\1/' || true)
          [ -n "$VERSION_NAME" ] || VERSION_NAME="${GITHUB_SHA::7}"
          CAPTION=$(printf 'Homa Messages — FOSS Release v%s\nCommit: %s\nBuild: %s' "$VERSION_NAME" "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER")
          RESPONSE_FILE="$RUNNER_TEMP/bale-response.json"
          HTTP_CODE=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' --connect-timeout 30 --max-time 1800 -X POST "https://tapi.bale.ai/bot${BALE_BOT_TOKEN}/sendDocument" --form "chat_id=${BALE_CHAT_ID}" --form "document=@${APK_PATH};type=application/vnd.android.package-archive" --form "caption=${CAPTION}")
          echo "Bale HTTP status: $HTTP_CODE"
          cat "$RESPONSE_FILE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Bale request failed with HTTP status $HTTP_CODE"
            exit 1
          fi
          if ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$RESPONSE_FILE"; then
            echo "Bale API did not report success"
            exit 1
          fi
      - name: Remove release keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
