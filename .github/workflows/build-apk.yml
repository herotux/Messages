name: Android CI

on:
  push:
    branches:
      - main
      - chore/minimal-commons
      - test/foss-release-signed
      - feat/iranian-bank-registry
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep the three tests independent. Build only the FOSS release APK to keep
# release CI lightweight while main is being stabilized.
jobs:
  unit-tests:
    name: Unit tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Core
            task: testCoreDebugUnitTest
          - variant: FOSS
            task: testFossDebugUnitTest
          - variant: GPlay
            task: testGplayDebugUnitTest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run ${{ matrix.variant }} unit tests
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon

      - name: Upload ${{ matrix.variant }} test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ matrix.variant }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lint --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  build-apk:
    name: Build FOSS release APK
    needs:
      - unit-tests
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/messages-release.p12
      TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
      TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

      # ubuntu-latest already provides the Android SDK. Avoid
      # android-actions/setup-android here because it installs extra tooling
      # such as the emulator and SDK tools before the actual build.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36\.0\.0' || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifact
          APK=$(find app/build/outputs/apk -type f -name '*foss*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "artifact/Messages-foss-release.apk"

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-foss-release
          path: artifact/Messages-foss-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
