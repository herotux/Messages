name: Android CI

# Keep CI on the current PR head so the merge ref is rebuilt after fixes.

on:
  push:
    branches:
      - main
      - test/foss-release-signed
      - feat/iranian-bank-registry
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Import bank VectorDrawable resources
        run: |
          # All bank logos use generated VectorDrawables except Sepah.
          # Sepah must remain a PNG because its vector resource is not safe
          # for the Android versions targeted by this project.
          # Do not delete scanner resources such as bank_card_scan_frame.xml.
          find app/src/main/res/drawable -maxdepth 1 -type f -name 'bank_*.png' ! -name 'bank_sepah.png' -delete
          for logo in \
            bank_saderat bank_mellat bank_tejarat bank_melli bank_keshavarzi \
            bank_parsian bank_maskan bank_refah bank_eghtesad_novin bank_pasargad \
            bank_saman bank_sina bank_post bank_tosee_taavon bank_shahr bank_ayandeh \
            bank_sarmayeh bank_dey bank_khavar_mianeh bank_iran_zamin bank_karafarin \
            bank_gardeshgari bank_sanat_madan bank_tosee_saderat bank_iran_venezuela \
            bank_resalat bank_melal; do
            rm -f "app/src/main/res/drawable/${logo}.xml"
          done
          test -f app/src/main/res/drawable/bank_sepah.png
          python3 tools/import_iranian_bank_logos.py
          test -f app/src/main/res/drawable/bank_sepah.png
          test ! -e app/src/main/res/drawable/bank_sepah.xml
          test -f app/src/main/res/drawable/bank_card_scan_frame.xml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Core unit tests
        run: ./gradlew testCoreDebugUnitTest --stacktrace

      - name: Run FOSS unit tests
        run: ./gradlew testFossDebugUnitTest --stacktrace

      - name: Run GPlay unit tests
        run: ./gradlew testGplayDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build Core debug APK
        run: ./gradlew assembleCoreDebug --stacktrace

      - name: Build FOSS debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Build GPlay debug APK
        run: ./gradlew assembleGplayDebug --stacktrace

      - name: Collect Core APK
        run: |
          mkdir -p artifacts/core
          APK=$(find app/build/outputs/apk -type f -name '*core*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/core/Messages-core-debug.apk
          ls -lh artifacts/core/Messages-core-debug.apk

      - name: Collect FOSS APK
        run: |
          mkdir -p artifacts/foss
          APK=$(find app/build/outputs/apk -type f -name '*foss*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/foss/Messages-foss-debug.apk
          ls -lh artifacts/foss/Messages-foss-debug.apk

      - name: Collect GPlay APK
        run: |
          mkdir -p artifacts/gplay
          APK=$(find app/build/outputs/apk -type f -name '*gplay*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/gplay/Messages-gplay-debug.apk
          ls -lh artifacts/gplay/Messages-gplay-debug.apk

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-core-debug
          path: artifacts/core/Messages-core-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-foss-debug
          path: artifacts/foss/Messages-foss-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload GPlay APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-gplay-debug
          path: artifacts/gplay/Messages-gplay-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
