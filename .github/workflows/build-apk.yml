name: Android CI

on:
  push:
    branches:
      - main
      - test/foss-release-signed
      - feat/iranian-bank-registry
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/messages-release.p12
      TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
      TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

      - name: Import bank VectorDrawable resources
        run: |
          find app/src/main/res/drawable -maxdepth 1 -type f -name 'bank_*.png' ! -name 'bank_sepah.png' -delete
          for logo in \
            bank_saderat bank_mellat bank_tejarat bank_melli bank_keshavarzi \
            bank_parsian bank_maskan bank_refah bank_eghtesad_novin bank_pasargad \
            bank_saman bank_sina bank_post bank_tosee_taavon bank_shahr bank_ayandeh \
            bank_sarmayeh bank_dey bank_khavar_mianeh bank_iran_zamin bank_karafarin \
            bank_gardeshgari bank_sanat_madan bank_tosee_saderat bank_iran_venezuela \
            bank_resalat bank_melal; do
            rm -f "app/src/main/res/drawable/${logo}.xml"
          done
          python3 tools/import_iranian_bank_logos.py
          test -f app/src/main/res/drawable/bank_sepah.png
          test -f app/src/main/res/drawable/bank_card_scan_frame.xml

      - name: Normalize standalone Settings Material color attribute
        run: |
          sed -i 's/com\.google\.android\.material\.R\.attr\.colorPrimary/androidx.appcompat.R.attr.colorPrimary/g' \
            app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt
          ! grep -n 'com\.google\.android\.material\.R\.attr\.colorPrimary' \
            app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt

      - name: Persist Settings normalization
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt; then
            echo "No Settings normalization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt
          git commit -m "Normalize standalone Settings color attribute"
          git push origin HEAD:main

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run Core unit tests
        run: ./gradlew testCoreDebugUnitTest --stacktrace

      - name: Run FOSS unit tests
        run: ./gradlew testFossDebugUnitTest --stacktrace

      - name: Run GPlay unit tests
        run: ./gradlew testGplayDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build Core release APK
        run: ./gradlew assembleCoreRelease --stacktrace

      - name: Build FOSS release APK
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Build GPlay release APK
        run: ./gradlew assembleGplayRelease --stacktrace

      - name: Collect Core APK
        run: |
          mkdir -p artifacts/core
          APK=$(find app/build/outputs/apk -type f -name '*core*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/core/Messages-core-release.apk

      - name: Collect FOSS APK
        run: |
          mkdir -p artifacts/foss
          APK=$(find app/build/outputs/apk -type f -name '*foss*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/foss/Messages-foss-release.apk

      - name: Collect GPlay APK
        run: |
          mkdir -p artifacts/gplay
          APK=$(find app/build/outputs/apk -type f -name '*gplay*release*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifacts/gplay/Messages-gplay-release.apk

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-core-release
          path: artifacts/core/Messages-core-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FOSS APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-foss-release
          path: artifacts/foss/Messages-foss-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload GPlay APK
        uses: actions/upload-artifact@v4
        with:
          name: Messages-gplay-release
          path: artifacts/gplay/Messages-gplay-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
