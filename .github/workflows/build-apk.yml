name: Android CI

on:
  push:
    branches:
      - main
      - test/foss-release-signed
      - refactor/internalize-commons
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-ui:
    name: Migrate complete UI feature set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Skip migration for normal builds
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/ui-theme-bank-migration-v2' }}
        run: echo "No UI migration requested."

      - name: Fetch UI feature branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ui-theme-bank-migration-v2' }}
        run: git fetch origin fix/folder-ui-stability-v2:refs/remotes/origin/fix/folder-ui-stability-v2

      - name: Replace app source and resources with complete UI feature set
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ui-theme-bank-migration-v2' }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/fix/folder-ui-stability-v2 -- app/src/main
          git checkout HEAD -- app/src/main/kotlin/org/fossify/messages/activities/HerotuxAboutActivity.kt
          git add app/src/main
          git diff --cached --check

      - name: Verify migration before commit
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ui-theme-bank-migration-v2' }}
        run: |
          chmod +x ./gradlew
          ./gradlew testCoreDebugUnitTest --stacktrace

      - name: Commit migrated tree
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ui-theme-bank-migration-v2' }}
        run: |
          if git diff --cached --quiet; then
            echo "Migration already applied."
          else
            git commit -m "migration: restore complete UI theme tabs and bank features"
            git push origin HEAD:fix/ui-theme-bank-migration-v2
          fi

  test-and-build:
    name: Test and build APKs
    needs: migrate-ui
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testCoreDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build core debug APK
        run: ./gradlew assembleCoreDebug --stacktrace

      - name: Build foss debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Build gplay debug APK
        run: ./gradlew assembleGplayDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts/core artifacts/foss artifacts/gplay
          cp app/build/outputs/apk/core/debug/*.apk artifacts/core/
          cp app/build/outputs/apk/foss/debug/*.apk artifacts/foss/
          cp app/build/outputs/apk/gplay/debug/*.apk artifacts/gplay/
          test -n "$(find artifacts/core -type f -name '*.apk' -print -quit)"
          test -n "$(find artifacts/foss -type f -name '*.apk' -print -quit)"
          test -n "$(find artifacts/gplay -type f -name '*.apk' -print -quit)"
          find artifacts -type f -name '*.apk' -exec ls -lh {} \;

      - name: Upload core APK
        uses: actions/upload-artifact@v4
        with:
          name: messages-core-debug-apk
          path: artifacts/core/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload foss APK
        uses: actions/upload-artifact@v4
        with:
          name: messages-foss-debug-apk
          path: artifacts/foss/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload gplay APK
        uses: actions/upload-artifact@v4
        with:
          name: messages-gplay-debug-apk
          path: artifacts/gplay/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
