name: Android CI

on:
  push:
    branches:
      - main
      - chore/minimal-commons
      - test/foss-release-signed
      - feat/iranian-bank-registry
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Keep the three tests and the three release variants independent so one slow
# Gradle task does not block every other task on the same runner.
jobs:
  unit-tests:
    name: Unit tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Core
            task: testCoreDebugUnitTest
          - variant: FOSS
            task: testFossDebugUnitTest
          - variant: GPlay
            task: testGplayDebugUnitTest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy fake-version checks locally
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/main/kotlin/org/fossify/commons/activities/BaseSimpleActivity.kt")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import org.fossify.commons.extensions.random\n", "")
          text = text.replace("import org.fossify.commons.extensions.showModdedAppWarning\n", "")
          on_create = '''        if (!packageName.startsWith("org.fossify.", true)) {\n            if ((0..50).random() == 10 || baseConfig.appRunCount % 100 == 0) {\n                showModdedAppWarning()\n            }\n        }\n'''
          customization = '''        if (!packageName.contains("yfissof".reversed(), true)) {\n            if (baseConfig.appRunCount > 100) {\n                showModdedAppWarning()\n                return\n            }\n        }\n'''
          if on_create not in text or customization not in text:
              raise SystemExit("Expected legacy fake-version checks were not found")
          text = text.replace(on_create, "", 1).replace(customization, "", 1)
          if "showModdedAppWarning" in text or "extensions.random" in text:
              raise SystemExit("Legacy fake-version references remain")
          path.write_text(text, encoding="utf-8")

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run ${{ matrix.variant }} unit tests
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon

      - name: Upload ${{ matrix.variant }} test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ matrix.variant }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy fake-version checks and commit the safe patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("app/src/main/kotlin/org/fossify/commons/activities/BaseSimpleActivity.kt")
          text = path.read_text(encoding="utf-8")
          original = text
          text = text.replace("import org.fossify.commons.extensions.random\n", "")
          text = text.replace("import org.fossify.commons.extensions.showModdedAppWarning\n", "")
          on_create = '''        if (!packageName.startsWith("org.fossify.", true)) {\n            if ((0..50).random() == 10 || baseConfig.appRunCount % 100 == 0) {\n                showModdedAppWarning()\n            }\n        }\n'''
          customization = '''        if (!packageName.contains("yfissof".reversed(), true)) {\n            if (baseConfig.appRunCount > 100) {\n                showModdedAppWarning()\n                return\n            }\n        }\n'''
          if on_create in text:
              text = text.replace(on_create, "", 1)
          if customization in text:
              text = text.replace(customization, "", 1)
          if "showModdedAppWarning" in text or "extensions.random" in text:
              raise SystemExit("Legacy fake-version references remain")

          if text != original:
              path.write_text(text, encoding="utf-8")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", str(path), ".github/workflows/remove-fake-version-warning.yml"], check=True)
              subprocess.run(["git", "rm", "-f", ".github/workflows/remove-fake-version-warning.yml"], check=False)
              subprocess.run(["git", "commit", "-m", "Remove fake-version checks safely"], check=True)
              subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
              print("Safe fake-version patch committed to main")
          else:
              print("Fake-version checks are already removed")

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lint --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  build-apks:
    name: Build ${{ matrix.variant }} release APK
    needs:
      - unit-tests
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Core
            task: assembleCoreRelease
            apk_glob: '*core*release*.apk'
            artifact: Messages-core-release
            filename: Messages-core-release.apk
          - variant: FOSS
            task: assembleFossRelease
            apk_glob: '*foss*release*.apk'
            artifact: Messages-foss-release
            filename: Messages-foss-release.apk
          - variant: GPlay
            task: assembleGplayRelease
            apk_glob: '*gplay*release*.apk'
            artifact: Messages-gplay-release
            filename: Messages-gplay-release.apk

    env:
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/messages-release.p12
      TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
      TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy fake-version checks locally
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/src/main/kotlin/org/fossify/commons/activities/BaseSimpleActivity.kt")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import org.fossify.commons.extensions.random\n", "")
          text = text.replace("import org.fossify.commons.extensions.showModdedAppWarning\n", "")
          on_create = '''        if (!packageName.startsWith("org.fossify.", true)) {\n            if ((0..50).random() == 10 || baseConfig.appRunCount % 100 == 0) {\n                showModdedAppWarning()\n            }\n        }\n'''
          customization = '''        if (!packageName.contains("yfissof".reversed(), true)) {\n            if (baseConfig.appRunCount > 100) {\n                showModdedAppWarning()\n                return\n            }\n        }\n'''
          if on_create not in text or customization not in text:
              raise SystemExit("Expected legacy fake-version checks were not found")
          text = text.replace(on_create, "", 1).replace(customization, "", 1)
          if "showModdedAppWarning" in text or "extensions.random" in text:
              raise SystemExit("Legacy fake-version references remain")
          path.write_text(text, encoding="utf-8")

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.variant }} release APK
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifact
          APK=$(find app/build/outputs/apk -type f -name '${{ matrix.apk_glob }}' | head -n 1)
          test -n "$APK"
          cp "$APK" "artifact/${{ matrix.filename }}"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
