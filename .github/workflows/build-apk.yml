name: Android CI

on:
  push:
    branches:
      - main
      - chore/minimal-commons
      - test/foss-release-signed
      - feat/iranian-bank-registry
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Core
            task: testCoreDebugUnitTest
          - variant: FOSS
            task: testFossDebugUnitTest
          - variant: GPlay
            task: testGplayDebugUnitTest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run ${{ matrix.variant }} unit tests
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon --max-workers=2

      - name: Upload ${{ matrix.variant }} test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-${{ matrix.variant }}
          path: app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lint --stacktrace --no-daemon --max-workers=2

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  build-apks:
    name: Build ${{ matrix.variant }} release APK
    needs:
      - unit-tests
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: Core
            task: assembleCoreRelease
            apk_glob: '*core*release*.apk'
            artifact: Messages-core-release
            filename: Messages-core-release.apk
          - variant: FOSS
            task: assembleFossRelease
            apk_glob: '*foss*release*.apk'
            artifact: Messages-foss-release
            filename: Messages-foss-release.apk
          - variant: GPlay
            task: assembleGplayRelease
            apk_glob: '*gplay*release*.apk'
            artifact: Messages-gplay-release
            filename: Messages-gplay-release.apk

    env:
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/messages-release.p12
      TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
      TAPSELL_BANNER_ZONE: ${{ secrets.TAPSELL_BANNER_ZONE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.variant }} release APK
        run: ./gradlew ${{ matrix.task }} --stacktrace --no-daemon --max-workers=2

      - name: Collect APK
        run: |
          mkdir -p artifact
          APK=$(find app/build/outputs/apk -type f -name '${{ matrix.apk_glob }}' | head -n 1)
          test -n "$APK"
          cp "$APK" "artifact/${{ matrix.filename }}"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        run: rm -f "$SIGNING_STORE_FILE"
