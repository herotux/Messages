name: temporary-theme-library-patch
on:
  push:
    branches:
      - chore/theme-library-ui-patch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Settings theme entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt')
          s = p.read_text()
          old = 'startActivity(Intent(this, HerotuxAboutActivity::class.java).putExtra(EXTRA_THEME_BUILDER, true))'
          new = 'startActivity(Intent(this, ThemeBuilderActivity::class.java).putExtra("create_theme", true))'
          if old not in s:
              raise SystemExit('Expected theme create route was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-theme-library-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/org/fossify/messages/activities/SettingsActivity.kt
          git commit -m "fix: open theme builder directly from settings"
          git push origin chore/theme-library-ui-patch
